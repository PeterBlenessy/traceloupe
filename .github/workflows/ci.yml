name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-hygiene:
    name: Repo hygiene (releases + doc links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the "every documented version is tagged"
          # check can see them.
          fetch-depth: 0
      - run: git fetch --tags --force --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails the PR if the current version has no CHANGELOG entry, if the
      # manifests disagree, or if a past documented version lost its tag.
      - run: bash scripts/check-releases.sh
      # Fails the PR if any relative Markdown link points at a missing file
      # (catches links left dangling by a doc move or rename).
      - run: bash scripts/check-doc-links.sh
      - run: node scripts/check-list-scroll.mjs
      - run: python3 tools/coverage-gap.py --self-test
      - run: node scripts/check-dates.mjs
      # Fails the PR if the browser mock and the backend describe different
      # worlds. The mock is what the design lint and every screenshot measure —
      # when it drifts, those checks quietly stop testing anything while still
      # reporting success.
      - run: node scripts/check-mock-parity.mjs
      # A module's surface must have a host view, or its rows render nowhere (#231).
      - run: node scripts/check-artifact-surfaces.mjs
      # No module may read a store the native importer already parses.
      - run: node scripts/check-artifact-overlap.mjs

  core:
    name: Core crate (Rust, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The core crate is UI-agnostic by design (docs/architecture.md §2) and
      # builds without Tauri's platform deps — this job stays cheap.
      - run: cargo test -p traceloupe-core
      # --all-targets so lints in test code fail CI too (without it, an unused
      # import inside #[cfg(test)] slips through — see issue #12).
      - run: cargo clippy -p traceloupe-core --all-targets -- -D warnings
      - run: cargo fmt -p traceloupe-core --check

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  shell:
    name: Tauri shell (compile check, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Measure the UI instead of trusting that it looked fine. Every visual bug
      # this project shipped was reviewed in a screenshot and accepted, so this
      # reads computed geometry across five views in the states an idle
      # screenshot never shows — hovered, filtered, search open, both text
      # extremes. It self-tests its own detectors first, so a rule that quietly
      # stops matching fails instead of reporting OK forever.
      - run: pnpm exec playwright install --with-deps chromium
      # All four browser checks share the one dev server. The last three were
      # previously in scripts/preflight.sh only, which meant they ran when an
      # agent remembered `--with-ui` and never otherwise — a guard nothing
      # enforces is a guard that decays. They gate merges now.
      - name: Browser checks
        run: |
          set -uo pipefail
          pnpm exec vite --port 1420 --strictPort &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          npx wait-on http://localhost:1420 -t 60000
          # Every check runs even when an earlier one fails. Under `bash -e` the
          # first failure hid the other three, so a run could report one problem
          # while sitting on several — and the next push would "fix CI" and then
          # fail again for a different reason.
          rc=0
          for check in \
            "node scripts/check-design.mjs" \
            "node scripts/check-encrypted-empty.mjs http://localhost:1420" \
            "node scripts/check-clickable.mjs http://localhost:1420" \
            "node scripts/check-view-intro.mjs http://localhost:1420" \
            "node scripts/check-view-scroll.mjs http://localhost:1420"; do
            echo "::group::$check"
            # shellcheck disable=SC2086
            $check || rc=1
            echo "::endgroup::"
          done
          exit "$rc"
      # Stage the llama-server sidecar so `bundle.externalBin` resolves — Tauri
      # validates it at cargo-check time. The binary is git-ignored (see
      # docs/reference/safety-scan-sidecar.md); the fast pre-built download satisfies the
      # compile check (a release build uses build-llama-server.sh for a static
      # binary instead).
      - run: bash scripts/download-llama-server.sh
      - run: cargo check -p traceloupe
      # RUN the shell crate's tests, don't just compile them. They were only ever
      # type-checked here (via clippy --all-targets), so the Channel stream
      # contract and the unbounded-command guard would both have passed CI while
      # failing — a test that never executes is worse than no test, because it
      # reads as coverage.
      - run: cargo test -p traceloupe
      # Lint the shell crate too (clippy needs the built `dist/` from pnpm
      # build above, which cargo check also relies on). --all-targets so
      # test-code lints in the Tauri crate are gated, not just the library.
      - run: cargo clippy -p traceloupe --all-targets -- -D warnings
