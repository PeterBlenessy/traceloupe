# App permissions — which apps were granted access to the camera, microphone,
# photos, contacts, location and so on, and when that was last decided.
#
# TCC.db is Apple's Transparency, Consent and Control store. It is confirmed
# backup-reachable: HomeDomain.RelativePathsToBackupAndRestore lists
# `Library/TCC` (see docs/reference/backup-coverage-audit.md).
#
# THREE alternatives, because two schema changes happened independently:
#
#   * `auth_value` (+ `auth_reason`, `auth_version`) replaced `allowed` (+
#     `prompt_count`) in iOS 14 / Big Sur.
#   * `last_modified` predates that change and exists on BOTH lineages — but not
#     on the very oldest.
#
# They are orthogonal, which is why iLEAPP tests for them separately rather than
# branching once. Collapsing them into two alternatives loses the date on every
# iOS 12/13 backup — and "when was this granted" is the more interesting half of
# the artifact. Order matters: most specific first.
#
# auth_value is Apple's kTCCAuthValue enum:
#   0 Denied · 1 Unknown (never prompted) · 2 Allowed · 3 Limited
# `allowed` on the older lineage is a plain 0/1.
#
# Searched CASE rather than `CASE auth_value WHEN …`, so a NULL is handled
# explicitly: `'x' || NULL` is NULL in SQLite, which would turn an unrecorded
# value into an empty cell instead of saying it was unrecorded.
#
# Service names are mapped to plain English only where the meaning is
# well-established. Anything else falls through as the raw kTCCService… string —
# which is ugly on purpose. Inventing a friendly label for a code nobody has
# verified would be presenting a guess as a fact, and the audit's rule for
# undecodable values applies to enums too. An ugly string that is true beats a
# tidy one that might not be.
#
# The mapping lives here rather than in the view because the view knows no
# artifact by name — that is what lets a new module appear with no UI change.
#
# VALIDATED against a real iPhone 11 / iOS 17.3 backup (Josh Hickman's public
# image): 289 rows, which is exactly the count iLEAPP records for the same image
# — two independent parsers agreeing. The distribution also justified passing
# unknowns through rather than guessing: alongside 0/2/3 the device carried
# **auth_value = 4**, which is in none of Apple's documented enum. It renders as
# "Unrecognised (4)". A confident ELSE would have mislabelled it.
#
# Reproduce with:
#   cargo run -p traceloupe-core --example validate_against_real_backup -- <dir> <password>

id          = "tcc"
name        = "Permissions"
description = "Which apps were allowed to use the camera, microphone, photos, contacts and location — and when that was decided."
verified    = "iphone11_ios17 — 289 rows, which is exactly the count iLEAPP records for the same image — two independent parsers agreeing. The distribution also justified passing unknowns through rather than guessing: alongside…"
surface     = "apps"
join_column = "App"   # the bundle id, so Apps can attach these to the right app
category    = "Security"
domain      = "HomeDomain"
path        = "Library/TCC/TCC.db"

sql = [
  # iOS 14+ / Big Sur onwards.
  """
  SELECT client AS app,
         CASE service
           WHEN 'kTCCServiceCamera' THEN 'Camera'
           WHEN 'kTCCServiceMicrophone' THEN 'Microphone'
           WHEN 'kTCCServicePhotos' THEN 'Photos'
           WHEN 'kTCCServicePhotosAdd' THEN 'Add to Photos'
           WHEN 'kTCCServiceAddressBook' THEN 'Contacts'
           WHEN 'kTCCServiceCalendar' THEN 'Calendar'
           WHEN 'kTCCServiceReminders' THEN 'Reminders'
           WHEN 'kTCCServiceMotion' THEN 'Motion & Fitness'
           WHEN 'kTCCServiceMediaLibrary' THEN 'Apple Music & media'
           WHEN 'kTCCServiceSpeechRecognition' THEN 'Speech recognition'
           WHEN 'kTCCServiceUserTracking' THEN 'Tracking'
           WHEN 'kTCCServiceBluetoothAlways' THEN 'Bluetooth'
           WHEN 'kTCCServiceBluetoothPeripheral' THEN 'Bluetooth'
           WHEN 'kTCCServiceFocusStatus' THEN 'Focus status'
           WHEN 'kTCCServiceSiri' THEN 'Siri'
           WHEN 'kTCCServiceFallDetection' THEN 'Fall detection'
           WHEN 'kTCCServiceExposureNotification' THEN 'Exposure notifications'
           ELSE service
         END AS service,
         CASE
           WHEN auth_value IS NULL THEN 'Not recorded'
           WHEN auth_value = 0 THEN 'Denied'
           WHEN auth_value = 1 THEN 'Not decided'
           WHEN auth_value = 2 THEN 'Allowed'
           WHEN auth_value = 3 THEN 'Limited'
           ELSE 'Unrecognised (' || auth_value || ')'
         END AS decision,
         last_modified AS decided_at
  FROM access
  ORDER BY client, service
  """,
  # iOS 12/13 lineage: `allowed`, but last_modified is still there.
  """
  SELECT client AS app,
         CASE service
           WHEN 'kTCCServiceCamera' THEN 'Camera'
           WHEN 'kTCCServiceMicrophone' THEN 'Microphone'
           WHEN 'kTCCServicePhotos' THEN 'Photos'
           WHEN 'kTCCServicePhotosAdd' THEN 'Add to Photos'
           WHEN 'kTCCServiceAddressBook' THEN 'Contacts'
           WHEN 'kTCCServiceCalendar' THEN 'Calendar'
           WHEN 'kTCCServiceReminders' THEN 'Reminders'
           WHEN 'kTCCServiceMotion' THEN 'Motion & Fitness'
           WHEN 'kTCCServiceMediaLibrary' THEN 'Apple Music & media'
           WHEN 'kTCCServiceSpeechRecognition' THEN 'Speech recognition'
           WHEN 'kTCCServiceUserTracking' THEN 'Tracking'
           WHEN 'kTCCServiceBluetoothAlways' THEN 'Bluetooth'
           WHEN 'kTCCServiceBluetoothPeripheral' THEN 'Bluetooth'
           WHEN 'kTCCServiceFocusStatus' THEN 'Focus status'
           WHEN 'kTCCServiceSiri' THEN 'Siri'
           WHEN 'kTCCServiceFallDetection' THEN 'Fall detection'
           WHEN 'kTCCServiceExposureNotification' THEN 'Exposure notifications'
           ELSE service
         END AS service,
         CASE
           WHEN allowed IS NULL THEN 'Not recorded'
           WHEN allowed = 0 THEN 'Denied'
           WHEN allowed = 1 THEN 'Allowed'
           ELSE 'Unrecognised (' || allowed || ')'
         END AS decision,
         last_modified AS decided_at
  FROM access
  ORDER BY client, service
  """,
  # Oldest: no last_modified column at all.
  """
  SELECT client AS app,
         CASE service
           WHEN 'kTCCServiceCamera' THEN 'Camera'
           WHEN 'kTCCServiceMicrophone' THEN 'Microphone'
           WHEN 'kTCCServicePhotos' THEN 'Photos'
           WHEN 'kTCCServicePhotosAdd' THEN 'Add to Photos'
           WHEN 'kTCCServiceAddressBook' THEN 'Contacts'
           WHEN 'kTCCServiceCalendar' THEN 'Calendar'
           WHEN 'kTCCServiceReminders' THEN 'Reminders'
           WHEN 'kTCCServiceMotion' THEN 'Motion & Fitness'
           WHEN 'kTCCServiceMediaLibrary' THEN 'Apple Music & media'
           WHEN 'kTCCServiceSpeechRecognition' THEN 'Speech recognition'
           WHEN 'kTCCServiceUserTracking' THEN 'Tracking'
           WHEN 'kTCCServiceBluetoothAlways' THEN 'Bluetooth'
           WHEN 'kTCCServiceBluetoothPeripheral' THEN 'Bluetooth'
           WHEN 'kTCCServiceFocusStatus' THEN 'Focus status'
           WHEN 'kTCCServiceSiri' THEN 'Siri'
           WHEN 'kTCCServiceFallDetection' THEN 'Fall detection'
           WHEN 'kTCCServiceExposureNotification' THEN 'Exposure notifications'
           ELSE service
         END AS service,
         CASE
           WHEN allowed IS NULL THEN 'Not recorded'
           WHEN allowed = 0 THEN 'Denied'
           WHEN allowed = 1 THEN 'Allowed'
           ELSE 'Unrecognised (' || allowed || ')'
         END AS decision,
         NULL AS decided_at
  FROM access
  ORDER BY client, service
  """,
]

# What the Apps view may show on the row itself, before anything is expanded.
# The view used to hard-code this — it filtered a literal "Decision" column for
# "Allowed"/"Limited" and printed "none granted" — which is artifact-specific
# knowledge in a view whose premise is that it knows no artifact by name. It
# showed up the moment a second apps-surface module shipped, as
# "Data usage: none granted".
[highlight]
column      = "Permission"
when_column = "Decision"
when_any_of = ["Allowed", "Limited"]
none_label  = "none granted"

[[columns]]
name = "App"
from = "app"

[[columns]]
name = "Permission"
from = "service"

[[columns]]
name = "Decision"
from = "decision"

[[columns]]
name = "Decided"
from = "decided_at"
kind = "timestamp"
epoch = "unix"
