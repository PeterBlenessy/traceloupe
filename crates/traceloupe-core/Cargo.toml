[package]
name = "traceloupe-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI-agnostic core for the local iOS backup browser: discovery, cache, import pipeline"

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls"] }
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
plist = { workspace = true }
time = { workspace = true }
ureq = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
sha1 = { workspace = true }
pbkdf2 = { workspace = true }
aes = { workspace = true }
aes-gcm = { workspace = true }
cbc = { workspace = true }
cipher = { workspace = true }
zeroize = { workspace = true }
aes-kw = { workspace = true, features = ["alloc"] }
flate2 = { workspace = true }
toml = { workspace = true }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = "3"
